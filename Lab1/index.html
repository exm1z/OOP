<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lab1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h2>Лабораторна робота №1</h2>
    <button id="work1">Робота 1</button>
    <button id="work2">Робота 2</button>
    <p id="result">Результат: —</p>
  </main>

  <dialog id="dialog1">
    <h3>Робота 1</h3>
    <input id="slider" type="range" min="1" max="100" value="50">
    <span id="number">50</span>
    <p><button id="saveNumber">Так</button> <button id="cancel1">Відміна</button></p>
  </dialog>

  <dialog id="dialog2">
    <h3>Робота 2 — перше вікно</h3>
    <button id="next">Далі &gt;</button>
    <button id="cancel2">Відміна</button>
  </dialog>

  <dialog id="dialog3">
    <h3>Робота 2 — друге вікно</h3>
    <button id="back">&lt; Назад</button>
    <button id="ok2">Так</button>
    <button id="cancel3">Відміна</button>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
